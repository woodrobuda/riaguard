name: trend_ema_vol
mode: stream
description: |
  Trend following: long when the fast EMA is above the slow EMA, short when below
  (position held between crossings), and flat whenever short-term volatility is high.
inputs: [price]
outputs:
  position: gated.o
  fast_ema: fast.o
  slow_ema: slow.o
  volatility: vol.o
nodes:
  - id: fast
    op: kema
    params: {span: 10}
    rationale: fast trend estimate; ~4.5-bar lag
  - id: slow
    op: kema
    params: {span: 40}
    rationale: slow trend estimate; ~19.5-bar lag sets the template's latency
  - id: cross
    op: kcross
    rationale: +1 / -1 events when fast crosses slow
  - id: pos
    op: khold
    rationale: turn crossing events into a held +1 / -1 position
  - id: ret
    op: klogret
    rationale: log returns for volatility
  - id: vol
    op: krunstats
    params: {stat: std, window: 20}
    rationale: 20-bar realised volatility of returns
  - id: calm
    op: kcompare
    params: {op: lt, real: 0.015}
    rationale: 1 when volatility is below 1.5% per bar, else 0
  - id: gated
    op: kmul
    rationale: position times calm-market filter
edges:
  - price -> fast.i
  - price -> slow.i
  - fast -> cross.i1
  - slow -> cross.i2
  - cross -> pos.i
  - price -> ret.i
  - ret -> vol.i
  - vol -> calm.i1
  - pos -> gated.i1
  - calm -> gated.i2
synthetic: {kind: gbm, n: 1500, seed: 1}
