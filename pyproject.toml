[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riaguard"
version = "0.1.0"
description = "Risk overlays, regime detection and explainable, surveillance-style alerts for small RIAs and broker-dealers. Analysis and alerts only; never places orders. Not investment advice."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "PyWavelets>=1.4", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/woodrobuda/riaguard"
Issues = "https://github.com/woodrobuda/riaguard/issues"

[project.optional-dependencies]
yfinance = ["yfinance>=0.2"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riaguard = ["sample_data/*.csv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", ".git"]
